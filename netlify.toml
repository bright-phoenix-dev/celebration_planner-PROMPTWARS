[build]
  publish = "dist"
  functions = "api"

[[redirects]]
  from = "/api/ai/ideas"
  to = "/.netlify/functions/ideas"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

